<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Countdown</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0d10;
            color: white;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* delikatne tło */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        .container {
            width: 90%;
            max-width: 850px;
            text-align: center;
        }

        .top {
            font-size: 13px;
            letter-spacing: 3px;
            color: #888;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .description {
            color: #777;
            margin-bottom: 45px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .box {
            background: #11151a;
            border: 1px solid #252b32;
            border-radius: 10px;
            width: 150px;
            padding: 25px 15px;

            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
            transition: 0.2s;
        }

        .box:hover {
            border-color: #3b82f6;
            transform: translateY(-3px);
        }

        .number {
            font-size: 45px;
            font-weight: bold;
            color: #3b82f6;
            font-variant-numeric: tabular-nums;
        }

        .label {
            margin-top: 8px;
            font-size: 11px;
            color: #777;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #555;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            .box {
                width: 130px;
                padding: 20px 10px;
            }

            .number {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top">SYSTEM // COUNTDOWN</div>

        <h1>Nadchodzi coś nowego</h1>

        <p class="description">
            Odliczanie do rozpoczęcia wydarzenia
        </p>

        <div class="countdown">

            <div class="box">
                <div class="number" id="days">00</div>
                <div class="label">Dni</div>
            </div>

            <div class="box">
                <div class="number" id="hours">00</div>
                <div class="label">Godzin</div>
            </div>

            <div class="box">
                <div class="number" id="minutes">00</div>
                <div class="label">Minut</div>
            </div>

            <div class="box">
                <div class="number" id="seconds">00</div>
                <div class="label">Sekund</div>
            </div>

        </div>

        <div class="footer">
            realmyszon.pl
        </div>

    </div>

    <script>
        // USTAW TUTAJ DATĘ KOŃCOWĄ
        const targetDate = new Date("2026-12-31T23:59:59").getTime();

        function updateCountdown() {

            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.getElementById("days").textContent = "00";
                document.getElementById("hours").textContent = "00";
                document.getElementById("minutes").textContent = "00";
                document.getElementById("seconds").textContent = "00";

                document.querySelector("h1").textContent = "CZAS MINĄŁ";

                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor(
                (difference / (1000 * 60 * 60)) % 24
            );
            const minutes = Math.floor(
                (difference / (1000 * 60)) % 60
            );
            const seconds = Math.floor(
                (difference / 1000) % 60
            );

            document.getElementById("days").textContent =
                String(days).padStart(2, "0");

            document.getElementById("hours").textContent =
                String(hours).padStart(2, "0");

            document.getElementById("minutes").textContent =
                String(minutes).padStart(2, "0");

            document.getElementById("seconds").textContent =
                String(seconds).padStart(2, "0");
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
