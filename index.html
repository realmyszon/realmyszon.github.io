<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIEMA</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: #222;
            text-align: center;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            font-size: 36px;
        }

        p {
            color: #666;
        }

        button {
            margin-top: 25px;
            padding: 20px 60px;
            font-size: 22px;
            font-weight: bold;
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #photo {
            display: none;
            width: 400px;
            max-width: 90%;
            margin: 30px auto 10px;
            border-radius: 8px;
        }

        #caption {
            display: none;
            font-size: 20px;
            font-weight: bold;
            color: #222;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>porno</h1>

        <p>pierdolnij w przycisk saszka</p>

        <button onclick="siema()">
            KUTAS
        </button>

        <img
            id="photo"
            src="https://cdn.phototourl.com/free/2026-09-04-04d5e9e7-3362-4127-9832-3db2120b875e.jpg"
            alt="Zdjęcie"
        >

        <div id="caption">
            jestes gejem i jestes czarny ciap ciap
        </div>

    </div>

    <script>
        function siema() {
            const photo = document.getElementById("photo");
            const caption = document.getElementById("caption");

            if (photo.style.display === "block") {
                photo.style.display = "none";
                caption.style.display = "none";
            } else {
                photo.style.display = "block";
                caption.style.display = "block";
            }
        }
    </script>

</body>
</html>
