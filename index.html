<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIEMA</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: #222;
            text-align: center;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            font-size: 36px;
        }

        p {
            color: #666;
        }

        input {
            margin-top: 20px;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-align: center;
        }

        button {
            margin-top: 15px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #photo {
            display: none;
            width: 400px;
            max-width: 90%;
            margin: 30px auto 10px;
            border-radius: 8px;
            cursor: pointer; /* Zmienia kursor na łapkę, żeby było widać, że można kliknąć */
        }

        #caption {
            display: none;
            font-size: 20px;
            font-weight: bold;
            color: #222;
            margin-top: 10px;
        }

        #error {
            display: none;
            color: red;
            margin-top: 15px;
        }

        #youtube {
            display: none;
            width: 1px;
            height: 1px;
            opacity: 0;
            position: absolute;
            left: -9999px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="login">
            <h1>siema cwelu</h1>

            <p>Wpisz hasło</p>

            <input
                type="password"
                id="password"
                placeholder="Hasło"
                onkeydown="if(event.key === 'Enter') sprawdzHaslo()"
            >

            <br>

            <button onclick="sprawdzHaslo()">
                WEJDŹ
            </button>

            <div id="error">
                Złe hasło
            </div>
        </div>

        <img
            id="photo"
            src="https://i.ibb.co/q3QSRGgS/IMG-3859.jpg"
            alt="Zdjęcie"
            onclick="uruchomPiosenke()"
        >

        <div id="caption">
            rucham ci mame<br>
        </div>

        <iframe
            id="youtube"
            src=""
            allow="autoplay; encrypted-media"
            allowfullscreen>
        </iframe>

    </div>

    <script>
        function sprawdzHaslo() {
            const password = document.getElementById("password").value;
            const login = document.getElementById("login");
            const photo = document.getElementById("photo");
            const error = document.getElementById("error");

            if (password === "jestemgejem") {
                login.style.display = "none";
                photo.style.display = "block"; // Pokazuje zdjęcie po poprawnym hasle
            } else {
                error.style.display = "block";
            }
        }

        function uruchomPiosenke() {
            const caption = document.getElementById("caption");
            const youtube = document.getElementById("youtube");

            caption.style.display = "block";
            youtube.style.display = "block";
            youtube.src = "https://www.youtube.com/embed/2tel3g-3x-s?autoplay=1&playsinline=1&loop=1&playlist=2tel3g-3x-s";
        }
    </script>

</body>
</html>
